services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: playd
      POSTGRES_USER: playd
      POSTGRES_PASSWORD: playd
    ports:
      - "5432:5432"
    volumes:
      - playd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playd -d playd"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://playd:playd@postgres:5432/playd
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  playd_postgres_data:
